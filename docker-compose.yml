services:
  postgres:
    image: postgres:16-alpine
    container_name: exchange-rates-db
    environment:
      POSTGRES_DB: exchangerates
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exchange-rates-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exchange-rates-app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: exchangerates
      DB_USER: postgres
      DB_PASSWORD: postgres
      FIXER_API_KEY: ${FIXER_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - exchange-rates-network

volumes:
  postgres_data:

networks:
  exchange-rates-network:
    driver: bridge
